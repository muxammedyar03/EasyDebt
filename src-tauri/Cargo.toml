[package]
name = "easydebt-desktop"
version = "2.0.8"
description = "EasyDebt Offline-First Desktop Application (Tauri v2)"
authors = ["EasyDebt Team"]
license = "MIT"
repository = "https://github.com/muxammedyar03/EasyDebt"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easydebt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.1.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-os = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-updater = "2"
