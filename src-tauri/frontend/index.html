<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyDebt</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .wrapper {
      text-align: center;
      max-width: 440px;
      padding: 32px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.7);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px auto;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .btn-retry {
      display: none;
      margin-top: 20px;
      padding: 8px 18px;
      font-size: 13px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-retry:hover { background-color: #0ea5e9; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="spinner" id="spinner"></div>
    <h1>EasyDebt</h1>
    <p id="msg">Tizim ishga tushirilmoqda, iltimos kuting...</p>
    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">Qayta urinish</button>
  </div>
  <script>
    const TARGET_URL = "http://127.0.0.1:3000/dashboard/default";
    let attempts = 0;
    const maxAttempts = 60;

    async function checkServer() {
      attempts++;
      try {
        await fetch("http://127.0.0.1:3000/api/health", { method: "GET", mode: "no-cors", cache: "no-store" });
        document.getElementById("msg").innerText = "Ulandi! Oynaga o'tilmoqda...";
        window.location.replace(TARGET_URL);
        return;
      } catch (err) {}

      if (attempts >= maxAttempts) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").innerText = "Lokal server javob bermadi. Server ishlayotganini tekshiring.";
        document.getElementById("retryBtn").style.display = "inline-block";
        return;
      }
      setTimeout(checkServer, 500);
    }

    function retryConnection() {
      attempts = 0;
      document.getElementById("spinner").style.display = "block";
      document.getElementById("retryBtn").style.display = "none";
      document.getElementById("msg").innerText = "Qayta ulanishga harakat qilinmoqda...";
      checkServer();
    }

    checkServer();
  </script>
</body>
</html>
