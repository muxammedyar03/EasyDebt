name: Permission checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/permissions-management]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --runInBand src/lib/security/__tests__/permission-catalog.test.ts src/lib/security/__tests__/permission-access.test.ts src/app/api/permissions/__tests__/route.test.ts
      - run: npm run test:permissions-db
      - run: npm run test:tenant-backup
      - run: npx tsc --noEmit --incremental false
