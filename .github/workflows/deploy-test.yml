name: Docker Build and Deploy (test)

on:
  push:
    branches: ["test"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxammedyar03/easydebt
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build cache buster
        run: echo "${{ github.sha }}" > .build-sha

      - name: Build and push Docker image (app:test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          cache-from: |
            type=gha,scope=build-cache-test
          cache-to: type=gha,mode=max,scope=build-cache-test
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push Docker image (migrate:migrate-test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate-test
          cache-from: |
            type=gha,scope=build-cache-test
          cache-to: type=gha,mode=max,scope=build-cache-test
          platforms: linux/amd64

  deploy:
    name: Deploy to Test VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Verify SSH deploy secrets
        env:
          TEST_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          PROD_HOST: ${{ secrets.DEPLOY_HOST }}
          TEST_USER: ${{ secrets.TEST_DEPLOY_USER }}
          PROD_USER: ${{ secrets.DEPLOY_USER }}
          TEST_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          PROD_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$TEST_HOST" ] && [ -z "$PROD_HOST" ]; then
            echo "::error::Missing host: set repository secret TEST_DEPLOY_HOST (recommended) or reuse DEPLOY_HOST for the same VPS."
            exit 1
          fi
          if [ -z "$TEST_USER" ] && [ -z "$PROD_USER" ]; then
            echo "::error::Missing SSH user: set TEST_DEPLOY_USER or DEPLOY_USER."
            exit 1
          fi
          if [ -z "$TEST_KEY" ] && [ -z "$PROD_KEY" ]; then
            echo "::error::Missing SSH private key: set TEST_SSH_PRIVATE_KEY or SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: Deploy to test server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          TEST_DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_DEPLOY_PORT || secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: TEST_DEPLOY_PATH
          script: |
            set -e
            DEPLOY_DIR="${TEST_DEPLOY_PATH:-/home/admin/apps/test_easydebt}"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deploy directory missing: $DEPLOY_DIR — on the server: mkdir -p ... && git clone (branch test), or set GitHub secret TEST_DEPLOY_PATH."
              exit 1
            fi
            cd "$DEPLOY_DIR"

            echo "🔐 Logging in to GHCR..."
            docker login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

            echo "📥 Pulling compose/env..."
            git pull origin test --no-edit || true

            echo "📦 Pulling images (:test, :migrate-test)..."
            docker compose -f docker-compose.test.yml pull

            echo "🚀 Starting stack..."
            docker compose -f docker-compose.test.yml up -d

            echo "📊 Status:"
            docker compose -f docker-compose.test.yml ps

            echo "🧹 Cleanup in background..."
            (docker image prune -af --filter "until=24h" && docker builder prune -af) &
