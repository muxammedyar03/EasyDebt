name: Docker Build and Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase (e.g. EasyDebt -> easydebt)
  IMAGE_NAME: muxammedyar03/easydebt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      # Har commitda build konteksti o'zgaradi — COPY cache ishlanmaydi, yangi kod image'ga kiradi
      - name: Set build cache buster
        run: echo "${{ github.sha }}" > .build-sha

      - name: Build and push Docker image (app)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=gha,mode=max,scope=build-cache
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push Docker image (migrate)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate
          cache-from: |
            type=gha,scope=build-cache
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/EasyDebt

            # Tag nomi (v1.0.1) = image tag, server shu versiyani tortadi
            # export IMAGE_TAG=${{ github.ref_name }}

            # Hozirgi build ning aniq image'ini tortish (latest emas — eski versiya tushmasin)
            export IMAGE_TAG=${{ github.sha }}

            echo "🔐 Logging in to GHCR..."
            docker login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

            echo "📥 Pulling latest compose/env..."
            git pull origin main --no-edit || true

            echo "📦 Pulling image (commit $IMAGE_TAG)..."
            docker compose -f docker-compose.prod.yml pull --quiet app
            docker compose -f docker-compose.prod.yml pull --quiet migrate

            echo "🚀 Containerni yangi image bilan qayta yaratish..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            echo "⏳ Waiting for app (5s)..."
            sleep 5

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "📝 Migration logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 migrate 2>/dev/null || true

            echo "✅ Deployment complete!"

            echo "🧹 Cleanup in background (non-blocking)..."
            (docker container prune -f && docker image prune -af --filter "until=24h" && docker builder prune -af) &
