name: Docker Build and Deploy

on:
  push:
    branches: ["test"]
    tags: ["v*"]
  pull_request:
    branches: ["test"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxammedyar03/easydebt
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build cache buster
        run: echo "${{ github.sha }}" > .build-sha

      - name: Build and push Docker image (app:test)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          cache-from: |
            type=gha,scope=build-cache-test
          cache-to: type=gha,mode=max,scope=build-cache-test
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push Docker image (migrate:migrate-test)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate-test
          cache-from: |
            type=gha,scope=build-cache-test
          cache-to: type=gha,mode=max,scope=build-cache-test
          platforms: linux/amd64

      - name: Extract metadata (tags, labels)
        id: meta
        if: github.event_name != 'push' || github.ref != 'refs/heads/test'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image (app)
        if: github.event_name != 'push' || github.ref != 'refs/heads/test'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=gha,mode=max,scope=build-cache
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push Docker image (migrate)
        if: github.event_name == 'push' && github.ref != 'refs/heads/test'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate
          cache-from: |
            type=gha,scope=build-cache
          cache-to: type=gha,mode=max,scope=build-cache
          platforms: linux/amd64

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref != 'refs/heads/test'

    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/EasyDebt

            export IMAGE_TAG=${{ github.sha }}

            echo "🔐 Logging in to GHCR..."
            docker login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

            echo "⚙️  Docker pull optimizatsiyasi sozlanmoqda..."
            export DOCKER_CLI_PLUGINS_PATH=/usr/libexec/docker/cli-plugins:$DOCKER_CLI_PLUGINS_PATH || true

            echo "🔍 Docker daemon status:"
            docker info | grep -E "(Server Version|Storage Driver|Logging Driver)" || true

            echo "📥 Pulling latest compose/env..."
            git pull origin main --no-edit || true

            echo "📦 Pulling image (commit $IMAGE_TAG)..."
            IMAGE_FULL="ghcr.io/muxammedyar03/easydebt:$IMAGE_TAG"

            echo "📊 Image hajmini tekshirish..."
            docker images $IMAGE_FULL 2>/dev/null || echo "Image hali pull qilinmagan"

            echo "⬇️  Image pull qilinmoqda (progress ko'rsatiladi)..."
            if timeout 900 docker pull $IMAGE_FULL 2>&1 | tee /tmp/docker-pull.log; then
              echo "✅ docker pull muvaffaqiyatli!"
            else
              echo "⚠️  docker pull muvaffaqiyatsiz, docker compose pull bilan urinib ko'ramiz..."
              if ! timeout 900 docker compose -f docker-compose.prod.yml pull app 2>&1 | tee -a /tmp/docker-pull.log; then
                echo "❌ Pull timeout yoki xatolik! Qayta urinib ko'ramiz..."
                sleep 5
                if ! timeout 900 docker pull $IMAGE_FULL; then
                  echo "❌ Ikkinchi urinish ham muvaffaqiyatsiz."
                  tail -50 /tmp/docker-pull.log || true
                  docker images ghcr.io/muxammedyar03/easydebt --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" | head -10
                  exit 1
                fi
              fi
            fi

            echo "✅ Image muvaffaqiyatli pull qilindi!"
            docker images $IMAGE_FULL --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"

            echo "🚀 Containerni yangi image bilan qayta yaratish..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            echo "⏳ Waiting for app (5s)..."
            sleep 5

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "📝 Migration logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 migrate 2>/dev/null || true

            echo "✅ Deployment complete!"

            echo "🧹 Cleanup in background (non-blocking)..."
            (docker container prune -f && docker image prune -af --filter "until=24h" && docker builder prune -af) &

  deploy-test:
    name: Deploy to Test VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'

    steps:
      - name: Verify SSH deploy secrets
        env:
          TEST_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          TEST_USER: ${{ secrets.TEST_DEPLOY_USER }}
          TEST_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$TEST_HOST" ]; then
            echo "::error::Set repository secret TEST_DEPLOY_HOST."
            exit 1
          fi
          if [ -z "$TEST_USER" ]; then
            echo "::error::Set repository secret TEST_DEPLOY_USER."
            exit 1
          fi
          if [ -z "$TEST_KEY" ]; then
            echo "::error::Set repository secret TEST_SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: Deploy to test server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          TEST_DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          port: ${{ secrets.TEST_DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: TEST_DEPLOY_PATH
          script: |
            set -e
            DEPLOY_DIR="${TEST_DEPLOY_PATH:-/home/admin/apps/test_easydebt}"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deploy directory missing: $DEPLOY_DIR"
              exit 1
            fi
            cd "$DEPLOY_DIR"

            echo "🔐 Logging in to GHCR..."
            docker login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

            echo "📥 Pulling compose/env..."
            git pull origin test --no-edit || true

            export IMAGE_TAG=test
            export MIGRATE_IMAGE_TAG=migrate-test

            echo "📦 Pulling images (docker-compose.prod.yml)..."
            docker compose -f docker-compose.prod.yml pull

            echo "🚀 Starting stack..."
            docker compose -f docker-compose.prod.yml up -d

            echo "📊 Status:"
            docker compose -f docker-compose.prod.yml ps

            echo "🧹 Cleanup in background..."
            (docker image prune -af --filter "until=24h" && docker builder prune -af) &
