name: Docker Build and Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase (e.g. EasyDebt -> easydebt)
  IMAGE_NAME: muxammedyar03/easydebt
  # Force GitHub Actions JavaScript actions to use Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      migrate_changed: ${{ steps.migrate_check.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if migrate image needs rebuild
        id: migrate_check
        run: |
          if [ "${{ github.event.before }}" = "" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(prisma/|src/lib/migrations/|scripts/migrate|Dockerfile)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      # Har commitda build konteksti o'zgaradi — COPY cache ishlanmaydi, yangi kod image'ga kiradi
      - name: Set build cache buster
        run: echo "${{ github.sha }}" > .build-sha

      - name: Build and push Docker image (app)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=gha,mode=max,scope=build-cache
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push Docker image (migrate)
        if: github.event_name == 'push' && steps.migrate_check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate
          cache-from: |
            type=gha,scope=migrate-cache
          cache-to: type=gha,mode=max,scope=migrate-cache
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -e
            cd /var/www/EasyDebt

            export IMAGE_TAG=${{ github.sha }}
            export MIGRATE_CHANGED=${{ needs.build.outputs.migrate_changed }}
            IMAGE_FULL="ghcr.io/muxammedyar03/easydebt:$IMAGE_TAG"
            MIGRATE_IMAGE="ghcr.io/muxammedyar03/easydebt:migrate"

            echo "🔐 Logging in to GHCR..."
            docker login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

            echo "📥 Pulling latest compose/env..."
            git pull origin main --no-edit || true

            pull_with_retry() {
              local image="$1"
              local max_attempts=3
              local attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                echo "⬇️  Pull attempt $attempt/$max_attempts: $image"
                if timeout 1800 docker pull "$image"; then
                  echo "✅ Pulled: $image"
                  return 0
                fi
                echo "⚠️  Pull failed, retrying in 15s..."
                sleep 15
                attempt=$((attempt + 1))
              done
              return 1
            }

            echo "📦 Pulling app image (commit $IMAGE_TAG)..."
            pull_with_retry "$IMAGE_FULL"

            if [ "$MIGRATE_CHANGED" = "true" ]; then
              echo "📦 Migration files changed — pulling migrate image..."
              pull_with_retry "$MIGRATE_IMAGE"
            else
              echo "⏭️  Migration files unchanged — skipping migrate pull (local image is used)"
              if ! docker image inspect "$MIGRATE_IMAGE" >/dev/null 2>&1; then
                echo "⚠️  Local migrate image missing — pulling once..."
                pull_with_retry "$MIGRATE_IMAGE"
              fi
            fi

            echo "🚀 Migrate + app qayta yaratiladi..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate migrate app

            echo "⏳ Waiting for app (5s)..."
            sleep 5

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "📝 Migration logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 migrate 2>/dev/null || true

            echo "✅ Deployment complete!"

            echo "🧹 Cleanup in background (non-blocking)..."
            (docker container prune -f && docker image prune -af --filter "until=24h" && docker builder prune -af) &
