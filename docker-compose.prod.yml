services:
  postgres:
    image: postgres:15-alpine
    container_name: debt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-debt_management}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    command: postgres -c max_connections=150
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-admin} -d ${POSTGRES_DB:-debt_management}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ghcr.io/muxammedyar03/easydebt:${MIGRATE_IMAGE_TAG:-migrate}
    container_name: debt_migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-debt_management}?schema=public&connection_limit=5
      NODE_ENV: production
    command: sh -c "./node_modules/.bin/prisma migrate deploy && npm run migrate:prod"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  app:
    image: ghcr.io/muxammedyar03/easydebt:${IMAGE_TAG:-latest}
    container_name: debt_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-debt_management}?schema=public&connection_limit=30&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      NODE_ENV: production
      OPENSSL_CONF: /dev/null
      VIRTUAL_HOST: ${DOMAIN:-test.easydebt.uz}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN:-test.easydebt.uz}
      LETSENCRYPT_EMAIL: ${SSL_EMAIL:-admin@test.easydebt.uz}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network
      - nginx-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - nginx-proxy
    restart: unless-stopped
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"

  letsencrypt:
    image: nginxproxy/acme-companion:latest
    container_name: letsencrypt
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: ${SSL_EMAIL:-admin@test.easydebt.uz}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_state:/etc/acme.sh
    networks:
      - nginx-proxy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  nginx-proxy:
    driver: bridge

volumes:
  postgres_data:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_state:
