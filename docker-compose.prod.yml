# Postgres + migrate + app. Bu faylda nginx/letsencrypt yo'q — ular test_easydebt stackda.
#
# Test stack konteyner nomlari: nginx-proxy, letsencrypt (NGINX_PROXY_CONTAINER=nginx-proxy).
# Docker tarmoq nomi (external): test_easydebt_nginx-proxy — app shu tarmoqqa ulanadi.
# Alohida VPSda bu tarmoq bo'lmasa: avval test stackni ko'taring yoki mos nom bilan yarating.
#
# Bir VPSda bir nechta DB/app: konteyner nomlari feat_debt_* (yoki keyinroq STACK_NAME).

services:
  postgres:
    image: postgres:15-alpine
    container_name: feat_debt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-debt_management}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    command: postgres -c max_connections=150
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${POSTGRES_DB:-debt_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ghcr.io/muxammedyar03/easydebt:migrate
    container_name: feat_debt_migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-debt_management}?schema=public
      NODE_ENV: production
    command: sh -c "set -e; ./node_modules/.bin/prisma migrate deploy; NODE_ENV=production ./node_modules/.bin/tsx scripts/migrate.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  app:
    image: ghcr.io/muxammedyar03/easydebt:${IMAGE_TAG:-latest}
    container_name: feat_debt_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-debt_management}?schema=public&connection_limit=30&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      N8N_API_KEY: ${N8N_API_KEY}
      NODE_ENV: production
      OPENSSL_CONF: /dev/null
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${SSL_EMAIL:?Set SSL_EMAIL in .env}
      # 413 (Content Too Large): upstream nginx-proxy/main nginx.tmpl CLIENT_MAX_BODY_SIZE ni o‘qimaydi.
      # Proxy serverda: /etc/nginx/vhost.d/$DOMAIN ichiga "client_max_body_size 100m;" qo‘shing va nginx-proxy ni reload qiling.
      # Namuna: deploy/nginx-proxy/vhost-snippet-client-max-body.conf
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network
      - nginx-proxy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
  nginx-proxy:
    external: true
    # name: test_easydebt_nginx-proxy
    name: easydebt_nginx-proxy

volumes:
  postgres_data:
